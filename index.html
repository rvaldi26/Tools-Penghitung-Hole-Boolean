<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tinkercad Boolean Calc Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 p-4 md:p-8 text-slate-800">

    <div class="max-w-4xl mx-auto">
        <!-- Header -->
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-bold text-indigo-700 mb-2 flex items-center justify-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-box"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>
                Tinkercad Calc Pro
            </h1>
            <p class="text-slate-600">Hitung presisi dinding untuk desain 3D Anda.</p>
        </header>

        <!-- Mode Selector -->
        <div class="flex bg-slate-200 p-1 rounded-xl mb-8 max-w-md mx-auto">
            <button onclick="setCalcMode(false)" id="tabHole" class="flex-1 py-2 px-4 rounded-lg text-sm font-bold transition bg-white shadow-sm text-indigo-600">Cari Ukuran Hole</button>
            <button onclick="setCalcMode(true)" id="tabOuter" class="flex-1 py-2 px-4 rounded-lg text-sm font-bold transition text-slate-500">Cari Ukuran Luar</button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <!-- Input Section -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <h2 id="inputTitle" class="text-lg font-semibold mb-4 flex items-center gap-2 text-indigo-600">
                    Dimensi Luar (Solid)
                </h2>
                
                <div class="space-y-4">
                    <div>
                        <label id="lblX" class="block text-sm font-medium text-slate-500 mb-1">Lebar (X) - mm</label>
                        <input type="number" id="inWidth" value="64" class="w-full p-2 bg-slate-100 rounded-lg border-none focus:ring-2 focus:ring-indigo-400 outline-none">
                    </div>
                    <div>
                        <label id="lblY" class="block text-sm font-medium text-slate-500 mb-1">Panjang (Y) - mm</label>
                        <input type="number" id="inLength" value="95" class="w-full p-2 bg-slate-100 rounded-lg border-none focus:ring-2 focus:ring-indigo-400 outline-none">
                    </div>
                    <div>
                        <label id="lblZ" class="block text-sm font-medium text-slate-500 mb-1">Tinggi (Z) - mm</label>
                        <input type="number" id="inHeight" value="20" class="w-full p-2 bg-slate-100 rounded-lg border-none focus:ring-2 focus:ring-indigo-400 outline-none">
                    </div>
                    <div class="pt-4 border-t border-slate-100">
                        <label class="block text-sm font-medium text-slate-500 mb-1 text-indigo-600">Ketebalan Dinding (mm)</label>
                        <input type="number" id="wallThickness" value="2" class="w-full p-2 bg-indigo-50 rounded-lg border-2 border-indigo-100 focus:ring-2 focus:ring-indigo-400 outline-none font-bold">
                    </div>
                    
                    <div class="flex items-center gap-4 pt-2">
                        <button id="btnWadah" onclick="setBoxMode(true)" class="flex-1 py-2 px-4 rounded-xl text-sm font-medium transition bg-indigo-600 text-white shadow-md">Wadah Atas Terbuka</button>
                        <button id="btnTertutup" onclick="setBoxMode(false)" class="flex-1 py-2 px-4 rounded-xl text-sm font-medium transition bg-slate-100 text-slate-600">Kotak Tertutup</button>
                    </div>
                </div>
            </div>

            <!-- Result Section -->
            <div class="space-y-6">
                <div id="resultCard" class="bg-indigo-900 text-white p-6 rounded-2xl shadow-xl transition-all duration-300">
                    <h2 id="resultTitle" class="text-lg font-semibold mb-4">Hasil Ukuran HOLE</h2>
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div class="bg-white/10 p-4 rounded-xl">
                            <p id="resLblX" class="text-xs text-indigo-200 uppercase tracking-wider">Lebar (X)</p>
                            <p class="text-3xl font-bold"><span id="resWidth">60</span> <span class="text-sm font-normal">mm</span></p>
                        </div>
                        <div class="bg-white/10 p-4 rounded-xl">
                            <p id="resLblY" class="text-xs text-indigo-200 uppercase tracking-wider">Panjang (Y)</p>
                            <p class="text-3xl font-bold"><span id="resLength">91</span> <span class="text-sm font-normal">mm</span></p>
                        </div>
                        <div class="bg-white/10 p-4 rounded-xl">
                            <p id="resLblZ" class="text-xs text-indigo-200 uppercase tracking-wider">Tinggi (Z)</p>
                            <p class="text-3xl font-bold"><span id="resHeight">20</span> <span class="text-sm font-normal">mm</span></p>
                        </div>
                        <div class="bg-amber-400/20 p-4 rounded-xl border border-amber-400/30">
                            <p class="text-xs text-amber-200 uppercase tracking-wider">Offset Z (Angkat)</p>
                            <p class="text-3xl font-bold text-amber-300"><span id="resOffset">2</span> <span class="text-sm font-normal text-amber-200">mm</span></p>
                        </div>
                    </div>
                </div>

                <!-- Guide Section -->
                <div class="bg-white p-6 rounded-2xl border border-slate-200">
                    <h3 class="text-sm font-bold text-slate-400 uppercase tracking-widest mb-4">Instruksi Tinkercad</h3>
                    <ul class="space-y-3 text-sm text-slate-600" id="guideList"></ul>
                </div>
            </div>
        </div>
    </div>

    <script>
        let isOpenTop = true;
        let isFindingOuter = false; // Mode sebaliknya

        const inputIds = ['inWidth', 'inLength', 'inHeight', 'wallThickness'];
        inputIds.forEach(id => {
            document.getElementById(id).addEventListener('input', calculate);
        });

        function setCalcMode(mode) {
            isFindingOuter = mode;
            const tabHole = document.getElementById('tabHole');
            const tabOuter = document.getElementById('tabOuter');
            const inputTitle = document.getElementById('inputTitle');
            const resultCard = document.getElementById('resultCard');
            const resultTitle = document.getElementById('resultTitle');

            if (isFindingOuter) {
                tabOuter.className = 'flex-1 py-2 px-4 rounded-lg text-sm font-bold transition bg-white shadow-sm text-indigo-600';
                tabHole.className = 'flex-1 py-2 px-4 rounded-lg text-sm font-bold transition text-slate-500';
                inputTitle.innerText = "Dimensi Dalam (Target)";
                resultTitle.innerText = "Hasil Ukuran LUAR (Solid)";
                resultCard.classList.replace('bg-indigo-900', 'bg-emerald-900');
            } else {
                tabHole.className = 'flex-1 py-2 px-4 rounded-lg text-sm font-bold transition bg-white shadow-sm text-indigo-600';
                tabOuter.className = 'flex-1 py-2 px-4 rounded-lg text-sm font-bold transition text-slate-500';
                inputTitle.innerText = "Dimensi Luar (Solid)";
                resultTitle.innerText = "Hasil Ukuran HOLE";
                resultCard.classList.replace('bg-emerald-900', 'bg-indigo-900');
            }
            updateLabels();
            calculate();
        }

        function updateLabels() {
            const prefix = isFindingOuter ? "Dalam" : "Luar";
            const resPrefix = isFindingOuter ? "Luar" : "Hole";
            document.getElementById('lblX').innerText = `Lebar ${prefix} (X) - mm`;
            document.getElementById('lblY').innerText = `Panjang ${prefix} (Y) - mm`;
            document.getElementById('lblZ').innerText = `Tinggi ${prefix} (Z) - mm`;
            document.getElementById('resLblX').innerText = `Lebar ${resPrefix} (X)`;
            document.getElementById('resLblY').innerText = `Panjang ${resPrefix} (Y)`;
            document.getElementById('resLblZ').innerText = `Tinggi ${resPrefix} (Z)`;
        }

        function setBoxMode(mode) {
            isOpenTop = mode;
            const btnWadah = document.getElementById('btnWadah');
            const btnTertutup = document.getElementById('btnTertutup');

            btnWadah.className = isOpenTop ? 'flex-1 py-2 px-4 rounded-xl text-sm font-medium transition bg-indigo-600 text-white shadow-md' : 'flex-1 py-2 px-4 rounded-xl text-sm font-medium transition bg-slate-100 text-slate-600';
            btnTertutup.className = !isOpenTop ? 'flex-1 py-2 px-4 rounded-xl text-sm font-medium transition bg-indigo-600 text-white shadow-md' : 'flex-1 py-2 px-4 rounded-xl text-sm font-medium transition bg-slate-100 text-slate-600';
            
            calculate();
        }

        function calculate() {
            const valW = parseFloat(document.getElementById('inWidth').value) || 0;
            const valL = parseFloat(document.getElementById('inLength').value) || 0;
            const valH = parseFloat(document.getElementById('inHeight').value) || 0;
            const wt = parseFloat(document.getElementById('wallThickness').value) || 0;

            let resW, resL, resH, offsetZ;

            if (!isFindingOuter) {
                // MODE NORMAL: Cari Hole
                resW = Math.max(0, valW - (wt * 2));
                resL = Math.max(0, valL - (wt * 2));
                resH = isOpenTop ? valH : Math.max(0, valH - (wt * 2));
                offsetZ = wt;
            } else {
                // MODE TERBALIK: Cari Luar
                resW = valW + (wt * 2);
                resL = valL + (wt * 2);
                resH = isOpenTop ? valH + wt : valH + (wt * 2);
                offsetZ = wt;
            }

            document.getElementById('resWidth').textContent = resW.toFixed(1);
            document.getElementById('resLength').textContent = resL.toFixed(1);
            document.getElementById('resHeight').textContent = resH.toFixed(1);
            document.getElementById('resOffset').textContent = offsetZ.toFixed(1);

            updateGuide(valW, valL, valH, resW, resL, resH, wt, offsetZ);
        }

        function updateGuide(vw, vl, vh, rw, rl, rh, wt, oz) {
            const guideList = document.getElementById('guideList');
            if (!isFindingOuter) {
                guideList.innerHTML = `
                    <li class="flex gap-2"><b>1.</b> Buat Box Solid ukuran ${vw}x${vl}x${vh}.</li>
                    <li class="flex gap-2"><b>2.</b> Buat Box HOLE ukuran ${rw}x${rl}x${rh}.</li>
                    <li class="flex gap-2"><b>3.</b> Align Tengah (X & Y), lalu angkat Hole ke atas sebesar ${oz}mm.</li>
                    <li class="flex gap-2"><b>4.</b> Group (Ctrl+G).</li>`;
            } else {
                guideList.innerHTML = `
                    <li class="flex gap-2"><b>1.</b> Buat Box Solid (Casing) ukuran ${rw}x${rl}x${rh}.</li>
                    <li class="flex gap-2"><b>2.</b> Buat Box HOLE ukuran ${vw}x${vl}x${vh} (sesuai benda Anda).</li>
                    <li class="flex gap-2"><b>3.</b> Align Tengah (X & Y), lalu angkat Hole ke atas sebesar ${oz}mm.</li>
                    <li class="flex gap-2"><b>4.</b> Group (Ctrl+G).</li>`;
            }
        }

        calculate(); // Jalankan pertama kali
    </script>
</body>
</html>
